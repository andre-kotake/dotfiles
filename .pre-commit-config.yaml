default_stages: [pre-commit]
fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: check-added-large-files
      - id: end-of-file-fixer

  - repo: local
    hooks:
      - id: shellcheck
        name: ShellCheck (System)
        entry: shellcheck
        language: system
        files: ^(bootstrap\.sh|lib/.*\.sh)$
